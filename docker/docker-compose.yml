version: '3.9'

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: cxrai-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://cxrai:cxrai@db:5432/cxrai
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cxrai-network
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: cxrai-frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - cxrai-network
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: cxrai-db
    environment:
      POSTGRES_USER: cxrai
      POSTGRES_PASSWORD: cxrai
      POSTGRES_DB: cxrai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cxrai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cxrai-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cxrai-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cxrai-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  cxrai-network:
    driver: bridge